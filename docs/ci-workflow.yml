# GitHub Actions CI 정의 — `.github/workflows/ci.yml` 에 그대로 올리는 실행본.
#
# 이 파일은 **순수 YAML** 이다. 설명은 docs/ci.md 에 있고, 여기에는 주석과
# 워크플로 본문만 둔다 (Markdown 코드 펜스 없음 → `cp` 만으로 실행 가능).
#
#   cp docs/ci-workflow.yml .github/workflows/ci.yml
#
# 푸시 거절 기록(Workflows 권한 없음)은 docs/ci.md 참고.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright (Chromium)
        run: |
          python -m pip install --upgrade pip
          pip install playwright pyyaml
          python -m playwright install --with-deps chromium

      - name: Repo checks (CI workflow copy is pure YAML)
        run: python3 tests/check_repo.py

      - name: Unit tests (core · places · live_places · directions · geocode)
        run: npm run test:unit --silent

  e2e:
    name: Interaction E2E
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright (Chromium)
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Interaction checks (local static server)
        run: npm run test:e2e --silent
